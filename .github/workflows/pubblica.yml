#
# Pubblica il sito su GitHub Pages.
#
# Cosa fa, in due passi. Prima **costruisce**: rigenera i documenti .html dai
# .md (pandoc) e poi copia tutto in `_site/`. Poi **pubblica** quella cartella
# così com'è.
#
# L'ordine conta: si genera dentro il repo e si copia dopo, così la copia
# contiene sia il markdown (la fonte) sia l'HTML che se ne ricava.
#
# La generazione sta **qui dentro** e non in uno script a parte: la usa solo
# questo workflow, a ogni pubblicazione, e uno script in più nel repo sarebbe un
# file che non serve a chi legge il progetto — e che finirebbe anche sul sito.
# Gli unici pezzi che stanno fuori sono `.github/pandoc/testata.html` (l'aspetto)
# e `.github/pandoc/sistema.py` (il titolo e i rimandi), che sono dati e non
# comandi, e `.github/` non finisce in `_site/`.
#
# Perché una copia e non il repo: nel repo stanno i .md, che sono la fonte, e
# basta. Gli .html sono un derivato, e un derivato che sta nel repo invecchia in
# silenzio — il modo per non farlo invecchiare è non conservarlo: nasce a ogni
# pubblicazione, dentro la copia che finisce online, e da nessun'altra parte.
#
# Qui arriva solo quello che è tracciato: quello che sta solo su una macchina
# non esiste in questa copia, e quindi non finisce online.
#
# La prima volta che questo workflow gira, Pages deve essere impostato su
# «GitHub Actions» come sorgente: senza quello la pubblicazione non parte.

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:      # per ripubblicare a mano, senza un commit

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione per volta: se ne arriva un'altra, la precedente si annulla.
concurrency:
  group: pagine
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Installa pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Genera i documenti
        run: |
          # L'aspetto dei documenti generati: gli stessi colori del sito, con in più
          # quello che serve a un testo lungo.
          testata=.github/pandoc/testata.html
          sistema=.github/pandoc/sistema.py

          # Niente evidenziazione della sintassi: pandoc colorerebbe con colori
          # fissi da tema chiaro — verde scuro, rosso scuro — che sul fondo scuro
          # del sito non si leggono. Il nome dell'opzione è cambiato in pandoc
          # 3.1: si chiede a pandoc quale conosce, invece di scegliere per lui.
          evidenziazione=--no-highlight
          if pandoc --help 2>/dev/null | grep -q -- '--syntax-highlighting'; then
            evidenziazione=--syntax-highlighting=none
          fi

          while IFS='|' read -r documento titolo prima; do
            [ -n "$documento" ] || continue
            uscita="${documento%.md}.html"

            # Il titolo NON si passa come metadato: pandoc lo stamperebbe anche in
            # cima al documento, dove il titolo c'è già. Lo mette a posto sistema.py.
            # `-V lang=it` invece serve: senza, la pagina dichiara `<html lang="">`.
            # `prima` è un frammento da mettere in testa, e ce l'ha solo ARCHITETTURA:
            # è il rimando all'indice dei riferimenti, che è da dove ci si arriva.
            if [ -n "$prima" ]; then
              pandoc "$documento" --from=gfm --to=html5 --standalone -V lang=it \
                "$evidenziazione" --include-in-header="$testata" \
                --include-before-body=".github/pandoc/$prima" --output="$uscita"
            else
              pandoc "$documento" --from=gfm --to=html5 --standalone -V lang=it \
                "$evidenziazione" --include-in-header="$testata" --output="$uscita"
            fi
            python3 "$sistema" "$uscita" "$titolo"
            echo "  $documento → $uscita"
          done <<'DOCUMENTI'
          ARCHITETTURA.md|Black Spider — Architettura|nav-root.html
          README.md|Black Spider — la porta d'ingresso|
          app/README.md|Black Spider — l'applicazione|
          spikes/README.md|M0.5 — le prove che vengono prima del codice|
          spikes/esiti/2026-09-29-automatiche.md|Esiti delle prove automatiche — 2026-09-29|
          DOCUMENTI

      - name: Copia il sito
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pubblica:
    needs: costruisci
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Pubblica
        id: pubblicazione
        uses: actions/deploy-pages@v5
