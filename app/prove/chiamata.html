<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Chiamata dentro l'app — Black Spider</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #0c0d14; color: #e8eaf2; }
  #riporto { padding: 14px 18px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  .ok { color: #3ecf8e; } .no { color: #e86b73; } .tenue { color: #6c7492; }
  iframe { width: 100%; height: 820px; border: 0; border-top: 1px solid #272b3c; }
</style>
</head>
<body>
<div id="riporto">chiamata in corso…</div>
<iframe id="app" src="../index.html"></iframe>
<script>
/* Prova della chiamata **dentro l'applicazione**, non accanto.
 *
 * È la differenza che conta rispetto a una prova di laboratorio: qui nessuno
 * chiama una funzione. Si apre l'app vera in un riquadro e le si clicca il
 * pulsante «Chiama», si accetta dall'altro lato cliccando «Accetta», si preme
 * «Muto» e «Video» come farebbe una persona. Fra il pulsante e la funzione c'è
 * tutto lo spazio in cui vivono i guasti veri, ed è quello spazio che si vuole
 * attraversare.
 *
 * Le due cose che nessuna lettura del codice può dire:
 *
 *  - la traccia audio **arriva** dall'altra parte, e
 *  - ci passano davvero dei byte (`chiamataByte` cresce).
 *
 * E una terza che vale per la promessa «solo voce»: `chiamataTipi` dice che
 * tracce sono arrivate. Se lì comparisse `video` senza che nessuno abbia
 * premuto il pulsante, la promessa sarebbe falsa.
 *
 * Niente STUN: i due browser sono sulla stessa macchina e si trovano con i
 * candidati locali. Niente esce da qui.
 */

const RUOLO = new URLSearchParams(location.search).get('ruolo') || 'A';
const ATTESA_MAX = 45000;
const riporto = [];
let finito = false;

function riga(testo, esito) {
  riporto.push({ testo: `[${RUOLO}] ${String(testo)}`, esito });
  document.getElementById('riporto').innerHTML = riporto.map((r) => {
    const segno = r.esito === true ? '<span class="ok">OK  </span>'
      : r.esito === false ? '<span class="no">NO  </span>' : '    ';
    return segno + r.testo.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }).join('\n');
}

function verifica(descrizione, condizione) {
  riga(descrizione, !!condizione);
  return !!condizione;
}

function invia() {
  if (finito) return;
  finito = true;
  const esiti = riporto.filter((r) => r.esito !== null);
  fetch('/api/esito-chiamata-' + RUOLO, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      ruolo: RUOLO,
      quando: new Date().toISOString(),
      passati: esiti.filter((r) => r.esito === true).length,
      falliti: esiti.filter((r) => r.esito === false).length,
      righe: riporto,
    }),
  }).catch(() => {});
}

const attendi = (ms) => new Promise((r) => setTimeout(r, ms));

async function finche(fn, descrizione, ms = ATTESA_MAX) {
  const inizio = Date.now();
  for (;;) {
    let v = null;
    try { v = await fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - inizio > ms) {
      riga(`scaduto: ${descrizione}`, false);
      invia();
      throw new Error('scaduto: ' + descrizione);
    }
    await attendi(150);
  }
}

const riquadro = document.getElementById('app');
const d = () => riquadro.contentDocument;
const $ = (sel) => d().querySelector(sel);
const testo = (sel) => ($(sel) || {}).textContent || '';

async function leggi(chiave) {
  const r = await fetch('/api/' + chiave);
  if (!r.ok) return null;
  const v = await r.json();
  return v && v.valore;
}

const scrivi = (chiave, valore) => fetch('/api/' + chiave, {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ valore }),
});

/** Lo stato della chiamata come lo racconta l'app: segni, non frasi tradotte. */
const statoChiamata = () => (d() && d().body.dataset.chiamata) || '';
const byteChiamata = () => Number((d() && d().body.dataset.chiamataByte) || 0);
const byteVideo = () => Number((d() && d().body.dataset.chiamataVideoByte) || 0);
const tipiChiamata = () => (d() && d().body.dataset.chiamataTipi) || '';

async function attendiAvvio() {
  await finche(() => {
    const b = d() && d().body;
    return b && (b.dataset.pronto === '1' || b.dataset.avvioFallito);
  }, 'l\'app finisca di avviarsi');
  if (d().body.dataset.avvioFallito) throw new Error('avvio fallito: ' + d().body.dataset.avvioFallito);
}

(async function () {
  try {
    await attendiAvvio();
    verifica('l\'app si è avviata', true);
    $('#usaStun').checked = false;

    /* --- 1. prima bisogna essere collegati: la chiamata non ha un invito suo - */

    if (RUOLO === 'A') {
      $('#btnCrea').click();
      const link = await finche(() => $('#invitoOut').value, 'l\'invito sia pronto');
      await scrivi('invito', link);
      const risposta = await finche(() => leggi('risposta'), 'arrivi la risposta di B');
      $('#rispostaIn').value = risposta;
      $('#btnCompleta').click();
    } else {
      const link = await finche(() => leggi('invito'), 'arrivi l\'invito di A');
      $('#invitoIn').value = link;
      $('#btnRispondi').click();
      const risposta = await finche(() => $('#rispostaOut').value, 'la risposta sia pronta');
      await scrivi('risposta', risposta);
    }

    await finche(() => !$('#pannelloChat').hidden, 'il canale si apra');
    // Quante righe ha il registro prima che si parli: alla fine si controlla che
    // sia cresciuto. Si contano le righe invece di cercare una parola, perché le
    // parole cambiano con la lingua e una prova che si rompe traducendo l'app
    // segnala sé stessa, non un guasto.
    const righePrima = $('#registro').children.length;
    verifica('la connessione è aperta', true);
    verifica('il pulsante per chiamare si è acceso', !$('#btnChiama').disabled);
    verifica('il pulsante lo dice: ' + ($('#btnChiama').getAttribute('title') || '').slice(0, 40),
      ($('#btnChiama').getAttribute('title') || '').length > 10);

    /* --- 2. la chiamata, dal pulsante ------------------------------------- */

    if (RUOLO === 'A') {
      // Il microfono si chiede quando si chiama, non quando si apre l'app: chi
      // apre Black Spider per leggere l'archivio non deve vedersi chiedere il
      // permesso di ascoltare. Qui la chiamata non è ancora cominciata.
      verifica('finora il microfono non è stato chiesto',
        !d().querySelector('audio#audioChiamata'));

      $('#btnChiama').click();
      await finche(() => statoChiamata() === 'chiamando', 'l\'app dica che sta chiamando');
      verifica('A ha chiamato e aspetta: ' + statoChiamata(), true);
      verifica('la barra della chiamata è comparsa', !$('#barraChiamata').hidden);
      verifica('c\'è il pulsante per riattaccare', !$('#btnRiattacca').hidden);
      verifica('non ci sono ancora pulsanti di risposta da questa parte',
        $('#btnAccetta').hidden && $('#btnRifiuta').hidden);
      // Chi chiama deve sapere chi sta chiamando: la scheda arriva con la
      // risposta, non si aspetta di sentirne la voce per scoprirlo.
      verifica('la barra dice chi sta chiamando: ' + testo('#chiamataTesto').trim(),
        /sp_[0-9a-z]/.test(testo('#chiamataTesto')));

      await finche(() => statoChiamata() === 'in-corso', 'B accetti');

    } else {
      await finche(() => statoChiamata() === 'squilla', 'arrivi la chiamata di A');
      verifica('a B squilla', true);
      verifica('la barra dice chi sta chiamando: ' + testo('#chiamataTesto').trim(),
        /sp_[0-9a-z]/.test(testo('#chiamataTesto')));
      verifica('ci sono accetta e rifiuta', !$('#btnAccetta').hidden && !$('#btnRifiuta').hidden);
      verifica('non c\'è ancora niente da mutare', $('#btnMuto').hidden);

      // Finché non si accetta non deve arrivare niente: la traccia di A esiste
      // ma la connessione non è ancora stata risposta.
      verifica('prima di accettare non è arrivata nessuna traccia', tipiChiamata() === '');

      $('#btnAccetta').click();
      await finche(() => statoChiamata() === 'in-corso', 'la chiamata parta');
    }

    /* --- 3. la voce passa? ------------------------------------------------- */

    await attendi(800);
    verifica('la chiamata è in corso', statoChiamata() === 'in-corso');
    verifica('l\'app ha creato l\'elemento dove si sente l\'altro', !!d().querySelector('audio#audioChiamata'));
    verifica('ci sono i pulsanti muto, video e riattacca',
      !$('#btnMuto').hidden && !$('#btnVideo').hidden && !$('#btnRiattacca').hidden);
    verifica('la barra mostra la durata: ' + testo('#chiamataDurata'),
      /^\d+:\d{2}$/.test(testo('#chiamataDurata').trim()));

    // Solo voce: nessuno ha premuto «Video», quindi di video non se ne parla.
    await finche(() => tipiChiamata().includes('audio'), 'arrivi la traccia audio dell\'altro');
    verifica('dall\'altra parte è arrivata la voce', tipiChiamata().includes('audio'));
    verifica('e nient\'altro che voce: ' + tipiChiamata(), tipiChiamata() === 'audio');

    const primo = byteChiamata();
    await attendi(3000);
    const secondo = byteChiamata();
    verifica(`in tre secondi sono arrivati ${secondo - primo} byte di voce`,
      secondo - primo > 3000);
    verifica('il conteggio cresce davvero', secondo > primo);

    /* --- 4. muto: la traccia resta, il suono no ---------------------------- */

    if (RUOLO === 'A') {
      $('#btnMuto').click();
      await attendi(600);
      verifica('A si è messo muto', $('#btnMuto').classList.contains('attivo'));
      verifica('e il pulsante ora dice il contrario: ' + testo('#btnMuto'),
        testo('#btnMuto').trim().length > 2);
      verifica('la traccia non è stata fermata: la connessione resta su',
        statoChiamata() === 'in-corso');
      $('#btnMuto').click();
      await attendi(600);
      verifica('A è tornato a parlare', !$('#btnMuto').classList.contains('attivo'));
    }

    /* --- 5. il video si aggiunge a chiamata avviata ------------------------ */

    /* A accende la telecamera; il video che ne esce lo riceve **B**, non A. A non
     * deve aspettarsi di ricevere niente: cercare qui una traccia video sarebbe
     * aspettare una cosa che per costruzione non succede — e le due prove si
     * scambiano i ruoli, ognuna guarda il pezzo che le spetta. */

    const testoPrima = testo('#chiamataTesto');

    if (RUOLO === 'A') {
      $('#btnVideo').click();
      await finche(() => $('#btnVideo').getAttribute('aria-pressed') === 'true',
        'l\'app dica che la telecamera è accesa', 15000);
      verifica('la telecamera risulta accesa', $('#btnVideo').classList.contains('attivo'));
      verifica('e la barra lo dice, senza che cambi altro: ' +
        testo('#chiamataTesto').trim().slice(-28),
        testo('#chiamataTesto') !== testoPrima);

      // La rinegoziazione è la strada più rischiosa di tutta la chiamata: mentre
      // si scambiano le nuove descrizioni la voce deve continuare ad arrivare.
      const primaDelVideo = byteChiamata();
      await attendi(6000);
      verifica('la chiamata è sopravvissuta alla rinegoziazione', statoChiamata() === 'in-corso');
      verifica(`e la voce non si è fermata (${byteChiamata() - primaDelVideo} byte in sei secondi)`,
        byteChiamata() > primaDelVideo);
      verifica('ad A non arriva nessun video: B non ne manda', tipiChiamata() === 'audio');

      $('#btnVideo').click();
      await finche(() => $('#btnVideo').getAttribute('aria-pressed') === 'false',
        'l\'app dica che la telecamera è spenta', 15000);
      const primaDiSpegnere = byteChiamata();
      await attendi(3000);
      verifica('la telecamera è spenta', !$('#btnVideo').classList.contains('attivo'));
      verifica('la barra è tornata com\'era: ' + testo('#chiamataTesto').trim().slice(-28),
        testo('#chiamataTesto') === testoPrima);
      verifica('e la chiamata è ancora in corso', statoChiamata() === 'in-corso');
      verifica(`la voce continua (${byteChiamata() - primaDiSpegnere} byte)`,
        byteChiamata() > primaDiSpegnere);

      // Si aspetta prima di riattaccare: B sta ancora misurando dall'altra parte,
      // e chiudere adesso vorrebbe dire misurare una linea che non c'è più.
      await attendi(9000);

    } else {
      await finche(() => tipiChiamata().includes('video'), 'arrivi il video di A', 40000);
      verifica('a B è arrivato il video di A: ' + tipiChiamata(),
        tipiChiamata() === 'audio,video');

      // Il video non è una riga nella SDP: è traffico, e va contato come traffico.
      // Si guardano i byte **video** in ingresso, non il totale di quelli audio —
      // confrontare l'audio con e senza video non misurerebbe niente, perché
      // l'audio è lo stesso nei due casi.
      const duranteIlVideo = byteVideo();
      await attendi(3000);
      const conVideo = byteVideo() - duranteIlVideo;
      verifica(`col video acceso arrivano byte di video: ${conVideo} in tre secondi`,
        conVideo > 0);

      await finche(() => !tipiChiamata().includes('video'), 'A spenga la telecamera', 40000);
      verifica('spenta la telecamera di A, a B resta la voce: ' + tipiChiamata(),
        tipiChiamata() === 'audio');
      // Prima di misurare, non dopo: A riattacca appena ha finito di misurare lei.
      verifica('e la chiamata è ancora in corso', statoChiamata() === 'in-corso');

      const dopoSenza = byteVideo();
      await attendi(3000);
      const senzaVideo = byteVideo() - dopoSenza;
      verifica(`e spenta la telecamera il video smette di arrivare (${senzaVideo} byte in tre secondi)`,
        senzaVideo === 0);
    }

    /* --- 6. riattaccare ---------------------------------------------------- */

    const primaDiChiudere = byteChiamata();
    if (RUOLO === 'A') {
      $('#btnRiattacca').click();
      await finche(() => statoChiamata() === 'chiusa', 'la chiamata si chiuda da questa parte');
      verifica('A ha riattaccato', true);
      verifica('la barra è sparita', $('#barraChiamata').hidden);
      verifica('la connessione NON è caduta con la chiamata: resta aperta',
        !$('#pannelloChat').hidden);
      verifica('c\'è chi ha ricevuto voce: ' + primaDiChiudere + ' byte', primaDiChiudere > 0);
    } else {
      await finche(() => statoChiamata() === 'chiusa', 'A riattacchi');
      verifica('B vede che A ha riattaccato', true);
      await attendi(400);
      verifica('e la barra è sparita anche da questa parte', $('#barraChiamata').hidden);
      verifica('la chat resta: si può ancora scrivere', !$('#pannelloChat').hidden);
    }

    const righeDopo = $('#registro').children.length;
    verifica(`il registro dell'app racconta la chiamata (${righePrima} righe → ${righeDopo})`,
      righeDopo > righePrima);
    riga('--- registro dell\'app ---', null);
    for (const r of testo('#registro').split('\n')) if (r.trim()) riga(r.trim(), null);

  } catch (e) {
    riga(`interrotta: ${e && e.message}`, false);
  }
  invia();
})();
</script>
</body>
</html>
